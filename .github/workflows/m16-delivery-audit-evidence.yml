name: M16 one-shot delivery futures data audit

on:
  pull_request:
    types: [labeled]
    branches:
      - m15-market-neutral-basis-convergence

permissions:
  contents: read

jobs:
  frozen-data-audit:
    if: >-
      github.event.label.name == 'documentation' &&
      github.event.pull_request.head.ref == 'm16-delivery-futures-data-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact M16 branch head
        uses: actions/checkout@v4
        with:
          ref: m16-delivery-futures-data-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify clean frozen M16 implementation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          python -m pytest -q
          python -m ruff check .
          python - <<'PY'
          from eba_trader.m16_delivery_policy import verify_m16_freeze
          manifest = verify_m16_freeze()
          assert manifest['status'] == 'FROZEN_PREDECLARED_DATA_AUDIT'
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          assert manifest['profitability_computation'] == 'forbidden'
          print('M16 frozen data-audit contract verified')
          PY
      - name: Run first complete frozen M16 data audit
        run: python -m eba_trader.m16_delivery_audit
      - name: Print immutable M16 summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path('artifacts/m16_delivery_futures_data_audit.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          print('decision:', report['decision'])
          print('family_decisions:', report['family_decisions'])
          print('eligible_families:', report['eligible_families'])
          print('profitability_computation:', report['profitability_computation'])
          print('oos_2025:', report['oos_2025'])
          print('evidence_sha256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Upload first complete M16 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: m16-delivery-futures-data-audit-first-result
          path: artifacts/m16_delivery_futures_data_audit.json
          if-no-files-found: error
          retention-days: 30
