name: M13 one-shot ML edge evidence

on:
  pull_request:
    types: [labeled]
    branches:
      - m12-cross-asset-eth-btc-edge

permissions:
  contents: read

jobs:
  frozen-evidence:
    if: >-
      github.event.label.name == 'documentation' &&
      github.event.pull_request.head.ref == 'm13-ml-edge-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact M13 branch head
        uses: actions/checkout@v4
        with:
          ref: m13-ml-edge-engine
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify clean frozen M13 implementation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          python -m pytest -q
          python -m ruff check .
          python - <<'PY'
          from eba_trader.m13_ml_policy import verify_m13_freeze
          manifest = verify_m13_freeze()
          assert manifest['status'] == 'FROZEN_PREDECLARED_NOT_RUN'
          assert manifest['hypothesis_test_count'] == 12
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          print('M13 frozen evidence contract verified')
          PY

      - name: Seed exact frozen BTC inputs
        run: |
          python - <<'PY'
          from eba_trader.m7_seed import ensure_m7_frozen_inputs
          manifest = ensure_m7_frozen_inputs(workers=8)
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          print('BTC Spot/futures/funding frozen inputs verified')
          PY

      - name: Reproduce exact M11-qualified ETH input
        run: |
          python - <<'PY'
          from pathlib import Path
          from eba_trader.m11_eth_perpetual_audit import run_m11_eth_perpetual_audit
          from eba_trader.m13_ml_policy import ETH_FUTURES_SHA256, sha256_file

          eth = Path('data/cache/m13/m11_ethusdt_usdm_15m_normalized.csv')
          report = run_m11_eth_perpetual_audit(
              workers=8,
              report_path='artifacts/m13_m11_seed_audit.json',
              normalized_path=eth,
          )
          assert report['decision'] == 'M11_ETH_PERPETUAL_DATA_AUDIT_PASS'
          assert sha256_file(eth) == ETH_FUTURES_SHA256
          print('ETH M11-qualified input reproduced and hash verified')
          PY

      - name: Run first complete frozen M13 evidence
        run: python -m eba_trader.m13_ml_edge

      - name: Print immutable M13 summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('artifacts/m13_ml_edge_engine.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          print('decision:', report['decision'])
          print('ML_LONG_EDGE_CANDIDATE:', report['search']['ml_long_edge_candidates'])
          print('discovery_passing_configs:', report['search']['discovery_passing_configs'])
          print('challenge_passing_configs:', report['search']['challenge_passing_configs'])
          print('oos_2025:', report['oos_2025'])
          print('evidence_sha256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY

      - name: Upload first complete M13 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m13-ml-edge-first-result
          path: |
            artifacts/m13_ml_edge_engine.json
            artifacts/m13_m11_seed_audit.json
          if-no-files-found: error
          retention-days: 30
