name: M10 cross-asset data audit validation

on:
  pull_request:
    branches:
      - m9-bookdepth-microstructure-edge
    paths:
      - "src/eba_trader/m10_cross_asset_*.py"
      - "tests/test_m10_cross_asset_audit.py"
      - "docs/M10_CROSS_ASSET_DATA_AUDIT_*"
      - "scripts/run_m10_cross_asset_audit.*"
      - "pyproject.toml"
      - ".github/workflows/m10-cross-asset-validation.yml"
      - ".github/workflows/m10-cross-asset-evidence.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify M10 frozen contract
        run: |
          python - <<'PY'
          from eba_trader.m10_cross_asset_policy import verify_m10_freeze
          manifest = verify_m10_freeze()
          assert manifest['status'] == 'FROZEN_PRE_AUDIT'
          assert manifest['forward_returns'] == 'forbidden'
          assert manifest['strategy_generation'] == 'forbidden'
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          print('M10 frozen audit contract verified')
          PY

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .
