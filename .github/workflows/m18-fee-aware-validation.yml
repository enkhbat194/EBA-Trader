name: M18 fee-aware execution validation

on:
  pull_request:
    branches:
      - m17-usdm-quarterly-cash-carry

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify M18 safety policy
        run: |
          python - <<'PY'
          from eba_trader.m18_demo_snapshot import BinanceDemoReadOnlyClient
          from eba_trader.m18_fee_policy import M18ExecutionPolicy
          from eba_trader.m18_fee_aware import BinanceReadOnlyClient
          from eba_trader.providers import BinanceProviderAdapter, ProviderCapability
          from eba_trader.providers.binance import BINANCE_ENDPOINTS
          from eba_trader.providers.base import ProviderEnvironment

          policy = M18ExecutionPolicy()
          assert policy.live_execution_allowed is False
          assert policy.ai_signal_authority is False
          for client in (BinanceReadOnlyClient, BinanceDemoReadOnlyClient, BinanceProviderAdapter):
              assert not hasattr(client, 'place_order')
              assert not hasattr(client, 'cancel_order')
              assert not hasattr(client, 'withdraw')
              assert not hasattr(client, 'change_leverage')
          assert ProviderCapability.LIVE_EXECUTION not in BinanceProviderAdapter.capabilities.fget(None)
          demo = BINANCE_ENDPOINTS[ProviderEnvironment.DEMO]
          assert demo.spot_rest == 'https://demo-api.binance.com'
          assert demo.futures_rest == 'https://demo-fapi.binance.com'
          print('M18 unified Demo read-only safety contract verified')
          PY

      - name: Verify M18.1 mobile UI safety
        run: |
          test -f web/index.html
          test -f web/app.css
          test -f web/app.js
          test -f web/manifest.webmanifest
          test -f web/sw.js
          grep -q 'LIVE 🔒' web/index.html
          grep -q 'MetaTrader 5' web/index.html
          grep -q 'MetaTrader 4' web/index.html
          grep -q 'Binance Demo API Key' web/index.html
          grep -q 'One Demo key is used for both Spot and USD-M Futures' web/index.html
          ! grep -q 'Futures Testnet API Key' web/index.html
          ! grep -q 'futuresApiKey' web/app.js
          grep -q '/api/demo/snapshot' web/app.js
          ! grep -q 'localStorage' web/app.js
          ! grep -q 'sessionStorage' web/app.js
          ! grep -q 'place_order' web/app.js
          echo 'M18.1 unified Demo UI safety contract verified'

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .
