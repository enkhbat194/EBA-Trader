name: M16 delivery futures audit validation

on:
  pull_request:
    branches:
      - m15-market-neutral-basis-convergence

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen M16 contract
        run: |
          python - <<'PY'
          from eba_trader.m16_delivery_policy import verify_m16_freeze
          manifest = verify_m16_freeze()
          assert manifest['status'] == 'FROZEN_PREDECLARED_DATA_AUDIT'
          assert manifest['expected_slots_per_contract'] == 2880
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          assert manifest['profitability_computation'] == 'forbidden'
          print('M16 frozen data-audit contract verified')
          PY
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .
