name: M10 one-shot cross-asset data audit evidence

on:
  pull_request:
    types: [labeled]
    branches:
      - m9-bookdepth-microstructure-edge

permissions:
  contents: read

jobs:
  frozen-audit:
    if: >-
      github.event.label.name == 'documentation' &&
      github.event.pull_request.head.ref == 'm10-cross-asset-data-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact M10 branch head
        uses: actions/checkout@v4
        with:
          ref: m10-cross-asset-data-audit
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify clean frozen audit implementation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          python -m pytest -q
          python -m ruff check .
          python - <<'PY'
          from eba_trader.m10_cross_asset_policy import verify_m10_freeze
          manifest = verify_m10_freeze()
          assert manifest['status'] == 'FROZEN_PRE_AUDIT'
          assert manifest['forward_returns'] == 'forbidden'
          assert manifest['strategy_generation'] == 'forbidden'
          assert manifest['risk_sizing'] == 'forbidden'
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          print('M10 frozen audit contract verified')
          PY

      - name: Run first complete frozen M10 audit
        run: python -m eba_trader.m10_cross_asset_audit --workers 8

      - name: Print immutable audit summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('artifacts/m10_cross_asset_data_audit.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          normalized = report['normalized']
          print('decision:', report['decision'])
          print('monthly_archives_present:', report['source']['monthly_archives_present'])
          print('checksum_verified_files:', report['source']['checksum_verified_files'])
          print('parse_error_files:', report['source']['parse_error_files'])
          print('accepted_unique_rows:', normalized['accepted_unique_rows'])
          print('coverage:', normalized['coverage'])
          print('missing_slots:', normalized['missing_slots'])
          print('max_missing_run_bars:', normalized['max_missing_run_bars'])
          print('conflicting_duplicate_timestamps:', normalized['conflicting_duplicate_timestamps'])
          print('invalid_rows:', normalized['invalid_rows'])
          print('normalized_csv_sha256:', normalized['csv_sha256'])
          print('oos_2025:', report['oos_2025'])
          print('evidence_sha256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY

      - name: Upload first complete M10 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: m10-cross-asset-data-audit-first-result
          path: |
            artifacts/m10_cross_asset_data_audit.json
            artifacts/m10_ethusdt_15m_normalized.csv
          if-no-files-found: error
          retention-days: 30
