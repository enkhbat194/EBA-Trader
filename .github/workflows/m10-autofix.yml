name: M10 one-shot implementation autofix

on:
  pull_request:
    branches:
      - m9-bookdepth-microstructure-edge
    paths:
      - "src/eba_trader/m10_cross_asset_audit.py"
      - ".github/workflows/m10-autofix.yml"

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact M10 branch
        uses: actions/checkout@v4
        with:
          ref: m10-cross-asset-data-audit
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.6'

      - name: Apply safe Ruff fixes and formatting
        run: |
          python -m ruff check src/eba_trader/m10_cross_asset_audit.py --fix || true
          python - <<'PY'
          from pathlib import Path

          path = Path('src/eba_trader/m10_cross_asset_audit.py')
          text = path.read_text(encoding='utf-8')
          old = '        raise RuntimeError("M10 audit report already exists; preserve the first complete result") from error'
          new = '''        raise RuntimeError(
              "M10 audit report already exists; preserve the first complete result"
          ) from error'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python -m ruff format src/eba_trader/m10_cross_asset_audit.py
          python -m ruff check src/eba_trader/m10_cross_asset_audit.py

      - name: Commit implementation-only formatting fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No autofix changes needed'
            exit 0
          fi
          git add src/eba_trader/m10_cross_asset_audit.py
          git commit -m 'Resolve M10 Ruff findings'
          git push origin HEAD:m10-cross-asset-data-audit
