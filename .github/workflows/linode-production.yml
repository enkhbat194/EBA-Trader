name: Linode production bundle

on:
  push:
    branches:
      - main
      - linode-production-bundle
      - linode-handsfree-public-pwa
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EBA_LEDGER_DB: /tmp/eba-trader/eba_trader.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          mkdir -p /tmp/eba-trader
          python -m pip install -e '.[dev]'

      - name: Python full regression suite
        run: pytest -q

      - name: Ruff
        run: ruff check src tests

      - name: Shell syntax
        run: |
          bash -n scripts/install_linode_runtime.sh
          bash -n scripts/update_linode_runtime.sh
          bash -n scripts/auto_update_entrypoint.sh
          bash -n scripts/repair_linode_auto_update.sh
          bash -n scripts/configure_linode_https.sh
          bash -n scripts/bootstrap_linode_public_https.sh

      - name: Deployment contract
        run: |
          test -f deploy/systemd/eba-auto-update.service
          test -f deploy/systemd/eba-auto-update.timer
          grep -q 'OnUnitActiveSec=5min' deploy/systemd/eba-auto-update.timer
          grep -q 'auto_update_entrypoint.sh' deploy/systemd/eba-auto-update.service
          grep -q 'last_error' scripts/auto_update_entrypoint.sh
          grep -q 'raw.githubusercontent.com/enkhbat194/EBA-Trader/main' scripts/repair_linode_auto_update.sh
          grep -q 'rollback' scripts/update_linode_runtime.sh
          grep -q 'bootstrap_linode_public_https.sh' scripts/update_linode_runtime.sh
          grep -q 'sslip.io' scripts/bootstrap_linode_public_https.sh
          grep -q '127.0.0.1:8000' scripts/configure_linode_https.sh
          ! test -f render.yaml
