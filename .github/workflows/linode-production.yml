name: Linode production bundle

on:
  push:
    branches:
      - main
      - linode-production-bundle
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EBA_LEDGER_DB: ${{ runner.temp }}/eba-trader/eba_trader.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Python tests
        run: pytest -q tests/test_persistence.py tests/test_persistent_momentum.py tests/test_web_server.py

      - name: Ruff
        run: ruff check src tests

      - name: Shell syntax
        run: |
          bash -n scripts/install_linode_runtime.sh
          bash -n scripts/update_linode_runtime.sh
          bash -n scripts/configure_linode_https.sh

      - name: Deployment contract
        run: |
          test -f deploy/systemd/eba-auto-update.service
          test -f deploy/systemd/eba-auto-update.timer
          grep -q 'OnUnitActiveSec=5min' deploy/systemd/eba-auto-update.timer
          grep -q 'rollback' scripts/update_linode_runtime.sh
          grep -q '127.0.0.1:8000' scripts/configure_linode_https.sh
          ! test -f render.yaml
