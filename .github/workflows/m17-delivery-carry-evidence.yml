name: M17 one-shot quarterly cash carry evidence

on:
  pull_request:
    types: [labeled]
    branches:
      - m16-delivery-futures-data-audit

permissions:
  contents: read

jobs:
  frozen-evidence:
    if: >-
      github.event.label.name == 'documentation' &&
      github.event.pull_request.head.ref == 'm17-usdm-quarterly-cash-carry'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact M17 branch head
        uses: actions/checkout@v4
        with:
          ref: m17-usdm-quarterly-cash-carry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify clean frozen M17 implementation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          python -m pytest -q
          python -m ruff check .
          python - <<'PY'
          from eba_trader.m17_delivery_carry_policy import verify_m17_freeze
          manifest = verify_m17_freeze()
          assert manifest['status'] == 'FROZEN_PREDECLARED_NOT_RUN'
          assert manifest['configuration_count'] == 3
          assert manifest['entry_offsets_days'] == [28, 14, 7]
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          assert manifest['coin_m'] == 'forbidden'
          assert manifest['settlement_price_model'] == 'forbidden_exit_15m_pre_delivery'
          print('M17 frozen evidence contract verified')
          PY
      - name: Seed exact frozen BTC Spot inputs
        run: |
          python - <<'PY'
          from eba_trader.m7_seed import ensure_m7_frozen_inputs
          manifest = ensure_m7_frozen_inputs(workers=8)
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          print('Frozen BTC Spot inputs verified')
          PY
      - name: Run first complete frozen M17 evidence
        run: python -m eba_trader.m17_delivery_carry
      - name: Print immutable M17 summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path('artifacts/m17_usdm_quarterly_cash_carry.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          print('decision:', report['decision'])
          print('candidate:', report['search']['market_neutral_delivery_carry_candidates'])
          print('discovery_passing_configs:', report['search']['discovery_passing_configs'])
          print('challenge_passing_configs:', report['search']['challenge_passing_configs'])
          print('challenge_access:', report['challenge_access'])
          print('oos_2025:', report['oos_2025'])
          print('evidence_sha256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Upload first complete M17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m17-quarterly-cash-carry-first-result
          path: artifacts/m17_usdm_quarterly_cash_carry.json
          if-no-files-found: error
          retention-days: 30
