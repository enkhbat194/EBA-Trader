name: Branch hygiene

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prune-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale merged branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repositoryFullName = `${owner}/${repo}`;
            const keep = new Set(['main', 'master', 'gh-pages']);

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const activeHeads = new Set(
              openPulls
                .filter((pr) => pr.head?.repo?.full_name === repositoryFullName)
                .map((pr) => pr.head.ref),
            );

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const deleted = [];
            const retained = [];

            for (const branch of branches) {
              const name = branch.name;
              if (keep.has(name) || branch.protected || activeHeads.has(name)) {
                retained.push(`${name}: protected/active`);
                continue;
              }

              let safeToDelete = false;

              const closedPulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'closed',
                head: `${owner}:${name}`,
                per_page: 100,
              });
              if (closedPulls.some((pr) => Boolean(pr.merged_at))) {
                safeToDelete = true;
              }

              if (!safeToDelete) {
                try {
                  const comparison = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `main...${name}`,
                  });
                  safeToDelete = comparison.data.ahead_by === 0;
                } catch (error) {
                  core.warning(`Could not compare ${name}: ${error.message}`);
                }
              }

              if (!safeToDelete) {
                retained.push(`${name}: contains unique/unmerged work`);
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`,
                });
                deleted.push(name);
              } catch (error) {
                core.warning(`Could not delete ${name}: ${error.message}`);
                retained.push(`${name}: delete failed`);
              }
            }

            core.summary
              .addHeading('Branch hygiene')
              .addRaw(`Deleted ${deleted.length} merged/stale branches.\n`)
              .addCodeBlock(deleted.join('\n') || '(none)')
              .addRaw(`\nRetained ${retained.length} branches.\n`)
              .addCodeBlock(retained.join('\n') || '(none)')
              .write();
