name: M8 alternative data audit validation

on:
  push:
    branches:
      - m8-alt-derivatives-data-audit
  pull_request:
    branches:
      - m7-funding-futures-edge-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify M8 frozen contract
        run: |
          python - <<'PY'
          from eba_trader.m8_alt_data_policy import verify_m8_audit_freeze
          manifest = verify_m8_audit_freeze()
          assert manifest['status'] == 'FROZEN_PRE_AUDIT'
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          assert manifest['forward_returns'] == 'forbidden'
          print('M8 frozen contract verified')
          PY

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .
