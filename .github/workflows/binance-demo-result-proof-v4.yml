name: Binance Demo v4 preserved proof after disable

on:
  push:
    branches: [binance-demo-result-proof-v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EBA_PRODUCTION_URL: https://eba-trader-172-236-150-62.sslip.io
      EXPECTED_BUILD: af63c6147c024a7ccf6e7613f5130975a8541325
      EXPECTED_PROBE: usdm-btcusdt-roundtrip-20260829-v4
    steps:
      - name: Verify exact build preserves completed Demo proof
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["EBA_PRODUCTION_URL"].rstrip("/")
          expected = os.environ["EXPECTED_BUILD"]
          expected_probe = os.environ["EXPECTED_PROBE"]
          deadline = time.time() + 900
          last = "not attempted"

          def get_json(path):
              # Read-only GET only. This proof never calls an exchange order endpoint.
              req = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "eba-demo-preserved-proof/1"},
                  method="GET",
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if not isinstance(data, dict):
                  raise RuntimeError(f"{path} returned non-object JSON")
              return data

          while time.time() < deadline:
              try:
                  app = get_json("/api/app-info")
                  build = str(app.get("buildSha") or "")
                  if build != expected:
                      last = f"waiting build {expected[:8]} server={build[:8] or 'unknown'}"
                      time.sleep(20)
                      continue

                  research = get_json("/api/research/status")
                  demo = ((research.get("productionProof") or {}).get("demoExecution") or {})
                  locks = research.get("locks") or {}
                  latency = demo.get("latency") or {}
                  fills = demo.get("fills") or {}

                  required = {
                      "probe_preserved": demo.get("probeId") == expected_probe,
                      "phase_complete": demo.get("phase") == "COMPLETE",
                      "passed": demo.get("passed") is True,
                      "environment_demo": demo.get("environment") == "demo",
                      "demo_host": demo.get("endpointHost") == "demo-fapi.binance.com",
                      "not_real_money": demo.get("realMoneyUsed") is False,
                      "live_locked": demo.get("liveExecutionAllowed") is False,
                      "no_auto_retry": demo.get("retryAutomatically") is False,
                      "open_filled": demo.get("openFilled") is True,
                      "close_filled": demo.get("closeFilled") is True,
                      "pre_zero": demo.get("prePositionZero") is True,
                      "post_zero": demo.get("postPositionZero") is True,
                      # Exact terminal metrics prove the old successful evidence was preserved,
                      # rather than replaced by a new execution result after disable.
                      "same_quantity": str(demo.get("quantity")) == "0.0007",
                      "same_open_fill": fills.get("openAvgPrice") == 77584.6,
                      "same_close_fill": fills.get("closeAvgPrice") == 77584.1,
                      "same_open_ack": latency.get("openOrderAckMs") == 212.03370700823143,
                      "same_close_ack": latency.get("closeOrderAckMs") == 221.3939509820193,
                      "same_roundtrip": latency.get("roundTripMs") == 3987.621519016102,
                      "global_oos_locked": locks.get("frozenOos") is True,
                      "global_real_locked": locks.get("realExecution") is True,
                  }
                  failed = [name for name, ok in required.items() if not ok]
                  summary = {
                      "build": build,
                      "probeId": demo.get("probeId"),
                      "phase": demo.get("phase"),
                      "passed": demo.get("passed"),
                      "quantity": demo.get("quantity"),
                      "fills": fills,
                      "latency": latency,
                      "frozenOosLocked": locks.get("frozenOos") is True,
                      "realExecutionLocked": locks.get("realExecution") is True,
                      "readOnlyProof": True,
                  }
                  if failed:
                      last = json.dumps({"failed": failed, "summary": summary}, sort_keys=True)[:3000]
                      time.sleep(20)
                      continue
                  print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  last = str(exc)[:1200]
                  time.sleep(20)

          raise SystemExit(f"preserved Demo v4 proof timed out: {last}")
          PY
