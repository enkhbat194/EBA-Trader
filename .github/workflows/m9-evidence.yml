name: M9 one-shot frozen book-depth evidence

on:
  pull_request:
    types: [labeled]
    branches:
      - m8-alt-derivatives-data-audit

permissions:
  contents: read

jobs:
  frozen-evidence:
    if: >-
      github.event.number == 5 &&
      github.event.label.name == 'documentation' &&
      github.event.pull_request.head.ref == 'm9-bookdepth-microstructure-edge'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact M9 branch head
        uses: actions/checkout@v4
        with:
          ref: m9-bookdepth-microstructure-edge
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify clean frozen implementation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          python -m pytest -q
          python -m ruff check .
          python - <<'PY'
          from eba_trader.m9_bookdepth_policy import verify_m9_freeze
          manifest = verify_m9_freeze()
          assert manifest['status'] == 'FROZEN_PREDECLARED_NOT_RUN'
          assert manifest['hypothesis_test_count'] == 24
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          assert manifest['parameter_changes_after_first_run'] == 'forbidden'
          print('M9 frozen evidence contract verified')
          PY

      - name: Run first complete frozen M9 evidence
        run: python -m eba_trader.m9_bookdepth --workers 12

      - name: Print immutable evidence summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('artifacts/m9_bookdepth_microstructure_edge.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          results = report['results']
          discovery_passes = sum(
              stats['discovery_pass']
              for result in results
              for stats in result['discovery'].values()
          )
          challenge_passes = sum(
              stats['challenge_pass']
              for result in results
              for stats in result['challenge'].values()
          )
          print('decision:', report['decision'])
          print('bookdepth_source:', report['bookdepth_source_audit']['status'])
          print('daily_file_coverage:', report['bookdepth_source_audit']['daily_file_coverage'])
          print('standardized_feature_bars:', report['standardized_feature_bars'])
          print('feature_dataset_sha256:', report['feature_dataset_sha256'])
          print('LONG_EDGE_CANDIDATE:', report['search']['long_edge_candidates'])
          print('NO_TRADE_VETO_CANDIDATE:', report['search']['no_trade_veto_candidates'])
          print('discovery_passing_horizons:', discovery_passes)
          print('challenge_passing_horizons:', challenge_passes)
          print('oos_2025:', report['oos_2025'])
          print('evidence_sha256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY

      - name: Upload first complete M9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m9-bookdepth-microstructure-first-result
          path: artifacts/m9_bookdepth_microstructure_edge.json
          if-no-files-found: error
          retention-days: 30
