name: Linode external production proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linode-external-production-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EBA_PRODUCTION_URL: https://eba-trader-172-236-150-62.sslip.io
    steps:
      - name: Wait for exact main build and verify sanitized production proof
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["EBA_PRODUCTION_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].strip()
          deadline = time.time() + 900
          last_error = "not attempted"
          expected_divergence_gates = sorted(
              [
                  {"price_delta_divergence_threshold": 0.01},
                  {"price_delta_divergence_threshold": 0.05},
                  {"price_delta_divergence_threshold": 0.1},
              ],
              key=lambda item: json.dumps(item, sort_keys=True),
          )

          def get_json(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "eba-production-proof/1"},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if not isinstance(payload, dict):
                  raise RuntimeError(f"{path} returned non-object JSON")
              return payload

          def sanitized_diagnostics(proof, report, sf1):
              return {
                  "journald": proof.get("journald"),
                  "researchRuntime": proof.get("researchRuntime"),
                  "services": proof.get("services"),
                  "m5RealAblation": proof.get("m5RealAblation"),
                  "m5Report": report,
                  "sf1": sf1,
                  "localApi": proof.get("localApi"),
                  "fastRestart": proof.get("fastRestart"),
              }

          while time.time() < deadline:
              try:
                  app = get_json("/api/app-info")
                  build = str(app.get("buildSha") or "")
                  if build != expected:
                      last_error = f"waiting for build {expected[:8]} (server {build[:8] or 'unknown'})"
                      time.sleep(20)
                      continue

                  research = get_json("/api/research/status")
                  credential = get_json("/api/demo/credential-status")
                  proof = research.get("productionProof") or {}
                  locks = research.get("locks") or {}
                  m5 = proof.get("m5RealAblation") or {}
                  m5_report = research.get("m5Report") or {}
                  sf1 = research.get("sf1") or {}
                  treatments = m5_report.get("treatments") or []
                  divergence_gates = []
                  if isinstance(treatments, list):
                      for treatment in treatments:
                          parameters = treatment.get("parameters") if isinstance(treatment, dict) else None
                          if not isinstance(parameters, dict) or set(parameters) != {
                              "price_delta_divergence_threshold"
                          }:
                              divergence_gates = []
                              break
                          value = parameters["price_delta_divergence_threshold"]
                          if isinstance(value, bool) or not isinstance(value, (int, float)):
                              divergence_gates = []
                              break
                          divergence_gates.append(
                              {"price_delta_divergence_threshold": float(value)}
                          )
                  divergence_gates.sort(key=lambda item: json.dumps(item, sort_keys=True))

                  checks = {
                      "exact_build": build == expected,
                      "https_ready": app.get("httpsReady") is True,
                      "credential_saved": credential.get("configured") is True,
                      "credential_encrypted": credential.get("credentialMode") == "encrypted_server_vault",
                      "credential_live_locked": credential.get("liveExecutionAllowed") is False,
                      "proof_available": proof.get("available") is True,
                      "local_contract": proof.get("localContractPassed") is True,
                      "production_smoke": proof.get("productionSmokePassed") is True,
                      "demo_reconnect": (proof.get("demoReconnect") or {}).get("passed") is True,
                      "chart": (proof.get("chart") or {}).get("passed") is True,
                      "positions": (proof.get("localApi") or {}).get("positions") is True,
                      "m5_complete": m5.get("phase") == "COMPLETE",
                      "m5_safe": m5.get("safe") is True,
                      "m5_all_terminal": m5.get("allTerminal") is True,
                      "m5_evidence_complete": m5.get("evidenceComplete") is True,
                      "m5_frozen_oos_closed": m5.get("frozenOosOpened") is False,
                      "m5_live_execution_locked": m5.get("liveExecutionAllowed") is False,
                      "m5_divergence_report_path": "m5-price-delta-divergence-ablation-"
                      in str(m5.get("reportPath") or ""),
                      "m5_report_available": m5_report.get("available") is True,
                      "m5_report_schema": m5_report.get("schema") == "m5_real_ablation_report_v1",
                      "m5_report_terminal": m5_report.get("allTerminal") is True,
                      "m5_report_all_passed": m5_report.get("allExperimentsPassed") is True,
                      "m5_report_evidence": m5_report.get("evidenceComplete") is True,
                      "m5_report_development_only": m5_report.get("developmentComparisonOnly") is True,
                      "m5_report_no_edge_claim": m5_report.get("edgeClaimAllowed") is False,
                      "m5_report_no_promotion": m5_report.get("promotionAuthority") is False,
                      "m5_report_frozen_oos_closed": m5_report.get("frozenOosOpened") is False,
                      "m5_report_live_locked": m5_report.get("liveExecutionAllowed") is False,
                      "m5_report_baseline_metrics": isinstance(
                          (m5_report.get("baseline") or {}).get("metrics"), dict
                      ),
                      "m5_report_treatments": isinstance(treatments, list) and len(treatments) == 3,
                      "m5_report_divergence_gates": divergence_gates == expected_divergence_gates,
                      "sf1_available": sf1.get("available") is True,
                      "sf1_complete": sf1.get("phase") == "COMPLETE",
                      "sf1_candidate_count": sf1.get("candidateCount") == 12,
                      "sf1_search_budget": sf1.get("multipleTestingBudget") == 48,
                      "sf1_window_count": sf1.get("windowCount") == 12,
                      "sf1_development_only": sf1.get("developmentEvidenceOnly") is True,
                      "sf1_no_edge_claim": sf1.get("edgeClaimAllowed") is False,
                      "sf1_no_promotion": sf1.get("promotionAuthority") is False,
                      "sf1_frozen_oos_closed": sf1.get("frozenOosOpened") is False,
                      "sf1_m5_frozen_oos_closed": sf1.get("m5FrozenOosOpened") is False,
                      "sf1_live_locked": sf1.get("liveExecutionAllowed") is False,
                      "frozen_oos_locked": locks.get("frozenOos") is True,
                      "real_execution_locked": locks.get("realExecution") is True,
                  }
                  failed = [name for name, passed in checks.items() if not passed]
                  if failed:
                      diagnostics = json.dumps(
                          sanitized_diagnostics(proof, m5_report, sf1),
                          sort_keys=True,
                          separators=(",", ":"),
                      )
                      last_error = (
                          "failed checks: "
                          + ", ".join(failed)
                          + "; sanitized diagnostics: "
                          + diagnostics[:8000]
                      )
                      time.sleep(20)
                      continue

                  fast_restart = proof.get("fastRestart") or {}
                  print(
                      json.dumps(
                          {
                              "ok": True,
                              "build": build,
                              "productionSmokePassed": True,
                              "demoReconnect": True,
                              "chart": True,
                              "positions": True,
                              "m5RealAblationPhase": m5.get("phase", "UNKNOWN"),
                              "m5RealAblationSafe": m5.get("safe") is True,
                              "m5ExitCode": m5.get("exitCode"),
                              "m5FailureStage": m5.get("failureStage"),
                              "m5ErrorSummary": m5.get("errorSummary"),
                              "m5AllTerminal": m5.get("allTerminal"),
                              "m5AllExperimentsPassed": m5.get("allExperimentsPassed"),
                              "m5EvidenceComplete": m5.get("evidenceComplete"),
                              "m5BatchId": m5.get("batchId"),
                              "m5ReportPath": m5.get("reportPath"),
                              "m5DivergenceGates": divergence_gates,
                              "m5Report": m5_report,
                              "sf1": sf1,
                              "fastRestartPhase": fast_restart.get("phase", "UNKNOWN"),
                              "fastRestartPassed": fast_restart.get("passed") is True,
                              "frozenOosLocked": True,
                              "realExecutionLocked": True,
                          },
                          separators=(",", ":"),
                      )
                  )
                  raise SystemExit(0)
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as exc:
                  last_error = str(exc)[:8000]
                  time.sleep(20)

          raise SystemExit(f"production proof timed out: {last_error}")
          PY
