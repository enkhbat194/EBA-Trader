name: Linode external production proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linode-external-production-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EBA_PRODUCTION_URL: https://eba-trader-172-236-150-62.sslip.io
    steps:
      - name: Wait for exact main build and verify sanitized production proof
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["EBA_PRODUCTION_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].strip()
          deadline = time.time() + 900
          last_error = "not attempted"

          def get_json(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "eba-production-proof/1"},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if not isinstance(payload, dict):
                  raise RuntimeError(f"{path} returned non-object JSON")
              return payload

          def sanitized_diagnostics(proof):
              return {
                  "journald": proof.get("journald"),
                  "researchRuntime": proof.get("researchRuntime"),
                  "services": proof.get("services"),
                  "m5RealAblation": proof.get("m5RealAblation"),
                  "localApi": proof.get("localApi"),
                  "fastRestart": proof.get("fastRestart"),
              }

          while time.time() < deadline:
              try:
                  app = get_json("/api/app-info")
                  build = str(app.get("buildSha") or "")
                  if build != expected:
                      last_error = f"waiting for build {expected[:8]} (server {build[:8] or 'unknown'})"
                      time.sleep(20)
                      continue

                  research = get_json("/api/research/status")
                  credential = get_json("/api/demo/credential-status")
                  proof = research.get("productionProof") or {}
                  locks = research.get("locks") or {}

                  checks = {
                      "exact_build": build == expected,
                      "https_ready": app.get("httpsReady") is True,
                      "credential_saved": credential.get("configured") is True,
                      "credential_encrypted": credential.get("credentialMode") == "encrypted_server_vault",
                      "credential_live_locked": credential.get("liveExecutionAllowed") is False,
                      "proof_available": proof.get("available") is True,
                      "local_contract": proof.get("localContractPassed") is True,
                      "production_smoke": proof.get("productionSmokePassed") is True,
                      "demo_reconnect": (proof.get("demoReconnect") or {}).get("passed") is True,
                      "chart": (proof.get("chart") or {}).get("passed") is True,
                      "positions": (proof.get("localApi") or {}).get("positions") is True,
                      "frozen_oos_locked": locks.get("frozenOos") is True,
                      "real_execution_locked": locks.get("realExecution") is True,
                  }
                  failed = [name for name, passed in checks.items() if not passed]
                  if failed:
                      diagnostics = json.dumps(
                          sanitized_diagnostics(proof),
                          sort_keys=True,
                          separators=(",", ":"),
                      )
                      last_error = (
                          "failed checks: "
                          + ", ".join(failed)
                          + "; sanitized diagnostics: "
                          + diagnostics[:2400]
                      )
                      time.sleep(20)
                      continue

                  m5 = proof.get("m5RealAblation") or {}
                  fast_restart = proof.get("fastRestart") or {}
                  print(
                      json.dumps(
                          {
                              "ok": True,
                              "build": build,
                              "productionSmokePassed": True,
                              "demoReconnect": True,
                              "chart": True,
                              "positions": True,
                              "m5RealAblationPhase": m5.get("phase", "UNKNOWN"),
                              "m5RealAblationSafe": m5.get("safe") is True,
                              "m5ExitCode": m5.get("exitCode"),
                              "m5AllTerminal": m5.get("allTerminal"),
                              "m5AllExperimentsPassed": m5.get("allExperimentsPassed"),
                              "m5EvidenceComplete": m5.get("evidenceComplete"),
                              "m5BatchId": m5.get("batchId"),
                              "m5ReportPath": m5.get("reportPath"),
                              "fastRestartPhase": fast_restart.get("phase", "UNKNOWN"),
                              "fastRestartPassed": fast_restart.get("passed") is True,
                              "frozenOosLocked": True,
                              "realExecutionLocked": True,
                          },
                          separators=(",", ":"),
                      )
                  )
                  raise SystemExit(0)
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as exc:
                  last_error = str(exc)[:3000]
                  time.sleep(20)

          raise SystemExit(f"production proof timed out: {last_error}")
          PY
