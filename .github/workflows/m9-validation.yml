name: M9 book-depth microstructure validation

on:
  pull_request:
    branches:
      - m8-alt-derivatives-data-audit
    paths:
      - "src/eba_trader/m9_bookdepth.py"
      - "src/eba_trader/m9_bookdepth_policy.py"
      - "tests/test_m9_bookdepth.py"
      - "tests/test_m9_bookdepth_policy.py"
      - "docs/M9_BOOKDEPTH_MICROSTRUCTURE_EDGE_PROTOCOL.md"
      - "docs/M9_BOOKDEPTH_MICROSTRUCTURE_EDGE_FREEZE.json"
      - "scripts/run_m9_bookdepth.ps1"
      - "scripts/run_m9_bookdepth.sh"
      - "pyproject.toml"
      - ".github/workflows/m9-validation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify M9 frozen contract
        run: |
          python - <<'PY'
          from eba_trader.m9_bookdepth_policy import verify_m9_freeze
          manifest = verify_m9_freeze()
          assert manifest['status'] == 'FROZEN_PREDECLARED_NOT_RUN'
          assert manifest['hypothesis_test_count'] == 24
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          assert manifest['parameter_changes_after_first_run'] == 'forbidden'
          print('M9 frozen contract verified')
          PY

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .
