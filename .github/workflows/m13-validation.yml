name: M13 ML edge validation

on:
  push:
    branches:
      - m13-ml-edge-engine
  pull_request:
    branches:
      - m12-cross-asset-eth-btc-edge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Verify M13 frozen contract
        run: |
          python - <<'PY'
          from eba_trader.m13_ml_policy import verify_m13_freeze
          manifest = verify_m13_freeze()
          assert manifest['status'] == 'FROZEN_PREDECLARED_NOT_RUN'
          assert manifest['feature_count'] == 19
          assert manifest['hypothesis_test_count'] == 12
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          print('M13 frozen contract verified')
          PY

      - name: Run deterministic tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .
