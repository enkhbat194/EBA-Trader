name: Strategy Factory v2 D0 production campaign proof

on:
  push:
    branches: [main]
    paths:
      - 'config/sfv2_d0_production_authorization_v1.json'
      - 'src/eba_trader/strategy_factory_v2_authorized.py'
      - 'src/eba_trader/sfv2_dashboard.py'
      - 'src/eba_trader/research_dashboard.py'
      - 'scripts/run_sfv2_d0_authorized_until_frozen.py'
      - 'scripts/run_sfv2_d0_authorized_production.sh'
      - 'scripts/run_m5_research_maintenance_once.sh'
      - '.github/workflows/sfv2-d0-campaign-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sfv2-d0-production-campaign-proof
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EBA_PRODUCTION_URL: https://eba-trader-172-236-150-62.sslip.io
    steps:
      - name: Wait for exact build and frozen D0 discovery outcome
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['EBA_PRODUCTION_URL'].rstrip('/')
          expected_sha = os.environ['EXPECTED_SHA'].strip()
          deadline = time.time() + 80 * 60
          last = 'not attempted'

          def get_json(path):
              request = urllib.request.Request(
                  base + path,
                  headers={'Accept': 'application/json', 'User-Agent': 'eba-sfv2-d0-proof/1'},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              if not isinstance(payload, dict):
                  raise RuntimeError(f'{path} returned non-object JSON')
              return payload

          while time.time() < deadline:
              try:
                  app = get_json('/api/app-info')
                  build = str(app.get('buildSha') or '')
                  if build != expected_sha:
                      last = f'waiting for build {expected_sha[:8]} (server {build[:8] or "unknown"})'
                      time.sleep(20)
                      continue

                  research = get_json('/api/research/status')
                  sfv2 = research.get('strategyFactoryV2') or {}
                  if sfv2.get('available') is not True:
                      last = f"SFv2 status unavailable: {sfv2.get('reason')}"
                      time.sleep(20)
                      continue
                  phase = sfv2.get('phase')
                  if phase == 'FAILED':
                      raise RuntimeError('production SFv2 D0 campaign reported FAILED')
                  if phase != 'COMPLETE':
                      last = (
                          f"SFv2 phase={phase} terminal={sfv2.get('terminalTrialCount')}/"
                          f"{sfv2.get('expectedTrialCount')}"
                      )
                      time.sleep(20)
                      continue

                  checks = {
                      'request_id': sfv2.get('requestId') == 'sfv2-d0-prod-20260901-v1',
                      'campaign_id': sfv2.get('campaignId') == 'sfv2-discovery-pilot-v1',
                      'authority': sfv2.get('authority') == 'DISCOVERY_ONLY',
                      'candidate_count': sfv2.get('candidateCount') == 406,
                      'stratum_count': sfv2.get('stratumCount') == 12,
                      'expected_trials': sfv2.get('expectedTrialCount') == 4872,
                      'terminal_trials': sfv2.get('terminalTrialCount') == 4872,
                      'selection_frozen': sfv2.get('selectionFrozen') is True,
                      'survivor_count': (
                          isinstance(sfv2.get('survivorCount'), int)
                          and not isinstance(sfv2.get('survivorCount'), bool)
                          and 0 <= sfv2.get('survivorCount') <= 30
                      ),
                      'not_fresh': sfv2.get('freshConfirmationEvidence') is False,
                      'no_verification': sfv2.get('verificationAuthority') is False,
                      'd1_closed': sfv2.get('d1Opened') is False,
                      'oos_closed': sfv2.get('frozenOosOpened') is False,
                      'live_locked': sfv2.get('liveExecutionAllowed') is False,
                      'real_locked': sfv2.get('realExecutionAllowed') is False,
                  }
                  failed = [name for name, passed in checks.items() if not passed]
                  if failed:
                      raise RuntimeError('SFv2 D0 completion safety check failed: ' + ', '.join(failed))

                  print(json.dumps({
                      'ok': True,
                      'build': build,
                      'campaignId': sfv2.get('campaignId'),
                      'sourceCodeSha': sfv2.get('sourceCodeSha'),
                      'candidateCount': sfv2.get('candidateCount'),
                      'terminalTrialCount': sfv2.get('terminalTrialCount'),
                      'completeCandidateCount': sfv2.get('completeCandidateCount'),
                      'rejectedCandidateCount': sfv2.get('rejectedCandidateCount'),
                      'behaviorallyEligibleCandidateCount': sfv2.get('behaviorallyEligibleCandidateCount'),
                      'behavioralClusterCount': sfv2.get('behavioralClusterCount'),
                      'survivorCount': sfv2.get('survivorCount'),
                      'survivorCandidateIds': sfv2.get('survivorCandidateIds'),
                      'topDiscoveryCandidates': sfv2.get('topDiscoveryCandidates'),
                      'authority': 'DISCOVERY_ONLY',
                      'd1Opened': False,
                      'frozenOosOpened': False,
                      'liveExecutionAllowed': False,
                      'realExecutionAllowed': False,
                  }, separators=(',', ':')))
                  raise SystemExit(0)
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as exc:
                  last = str(exc)[:4000]
                  if 'reported FAILED' in last or 'safety check failed' in last:
                      raise
                  time.sleep(20)

          raise SystemExit(f'SFv2 D0 production campaign proof timed out: {last}')
          PY
