name: M17 quarterly cash carry validation

on:
  pull_request:
    branches:
      - m16-delivery-futures-data-audit

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen M17 contract
        run: |
          python - <<'PY'
          from eba_trader.m17_delivery_carry_policy import verify_m17_freeze
          manifest = verify_m17_freeze()
          assert manifest['status'] == 'FROZEN_PREDECLARED_NOT_RUN'
          assert manifest['configuration_count'] == 3
          assert manifest['entry_offsets_days'] == [28, 14, 7]
          assert manifest['oos_2025'] == 'LOCKED_NOT_ACCESSED'
          assert manifest['coin_m'] == 'forbidden'
          assert manifest['leverage'] == 'forbidden'
          print('M17 frozen contract verified')
          PY
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .
