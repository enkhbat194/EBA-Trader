name: M7 frozen evidence (closed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-cycle-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact M7 branch head
        uses: actions/checkout@v4
        with:
          ref: m7-funding-futures-edge-discovery
          fetch-depth: 0

      - name: Refuse post-result M7 evidence rerun
        run: |
          test -f docs/M7_FUNDING_FUTURES_EDGE_DISCOVERY_RESULT_2026-08-21.md
          echo 'M7 is closed. The immutable first result is GitHub Actions run 32424800002.'
          echo 'Post-result evidence reruns are forbidden.'
          exit 1
