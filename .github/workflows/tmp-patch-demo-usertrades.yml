name: Temporary patch Demo userTrades fill proof

on:
  push:
    branches: [fix-demo-usertrades-fill-proof]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-demo-usertrades-fill-proof
          fetch-depth: 0
      - name: Apply robust fill lookup and v4 probe
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/eba_trader/binance_demo_execution.py')
          source = source_path.read_text(encoding='utf-8')

          query_method = '''    def query_order(self, *, symbol: str, order_id: int) -> RequestResult:\n        result = self._request(\n            "GET",\n            "/fapi/v1/order",\n            params={"symbol": symbol, "orderId": str(order_id)},\n            signed=True,\n        )\n        if not isinstance(result.payload, dict):\n            raise RuntimeError("Binance Demo query order response is invalid")\n        return result\n'''
          account_trades_method = query_method + '''\n    def account_trades(self, *, symbol: str, order_id: int) -> RequestResult:\n        result = self._request(\n            "GET",\n            "/fapi/v1/userTrades",\n            params={"symbol": symbol, "orderId": str(order_id), "limit": "100"},\n            signed=True,\n        )\n        if not isinstance(result.payload, list):\n            raise RuntimeError("Binance Demo userTrades response is invalid")\n        rows = [row for row in result.payload if isinstance(row, dict)]\n        return RequestResult(payload=rows, latency_ms=result.latency_ms)\n'''
          if 'def account_trades(self, *, symbol: str, order_id: int)' not in source:
              if query_method not in source:
                  raise SystemExit('query_order insertion point not found')
              source = source.replace(query_method, account_trades_method, 1)

          fill_block = '''def _fill_price(payload: dict[str, Any]) -> Decimal:\n    price = _decimal(payload.get("avgPrice", "0"), label="avgPrice")\n    if price <= 0:\n        price = _decimal(payload.get("price", "0"), label="price")\n    if price <= 0:\n        executed_qty = _decimal(payload.get("executedQty", "0"), label="executedQty")\n        cum_quote = _decimal(payload.get("cumQuote", "0"), label="cumQuote")\n        if executed_qty > 0 and cum_quote > 0:\n            price = cum_quote / executed_qty\n    if price <= 0:\n        raise RuntimeError("Binance Demo filled order has no positive fill price")\n    return price\n'''
          fill_helpers = fill_block + '''\n\ndef _order_id(payload: dict[str, Any]) -> int:\n    value = payload.get("orderId")\n    if isinstance(value, bool) or not isinstance(value, int):\n        raise RuntimeError("Binance Demo filled order has no usable orderId")\n    return value\n\n\ndef _fill_price_from_user_trades(\n    rows: list[dict[str, Any]],\n    *,\n    order_id: int,\n) -> Decimal:\n    total_qty = Decimal("0")\n    total_quote = Decimal("0")\n    for row in rows:\n        if str(row.get("orderId")) != str(order_id):\n            continue\n        qty = _decimal(row.get("qty", row.get("baseQty", "0")), label="tradeQty")\n        price = _decimal(row.get("price", "0"), label="tradePrice")\n        if qty <= 0 or price <= 0:\n            continue\n        total_qty += qty\n        total_quote += qty * price\n    if total_qty <= 0 or total_quote <= 0:\n        raise RuntimeError("Binance Demo userTrades has no positive fill rows for order")\n    return total_quote / total_qty\n\n\ndef _resolve_fill_price(\n    client: BinanceDemoExecutionClient,\n    *,\n    symbol: str,\n    payload: dict[str, Any],\n) -> tuple[Decimal, float, str]:\n    try:\n        return _fill_price(payload), 0.0, "order_response"\n    except RuntimeError:\n        pass\n\n    order_id = _order_id(payload)\n    lookup_ms = 0.0\n    queried = client.query_order(symbol=symbol, order_id=order_id)\n    lookup_ms += queried.latency_ms\n    if isinstance(queried.payload, dict):\n        try:\n            return _fill_price(queried.payload), lookup_ms, "query_order"\n        except RuntimeError:\n            pass\n\n    deadline = time.monotonic() + 5.0\n    last_error = "no userTrades rows"\n    while time.monotonic() < deadline:\n        trades = client.account_trades(symbol=symbol, order_id=order_id)\n        lookup_ms += trades.latency_ms\n        if not isinstance(trades.payload, list):\n            raise RuntimeError("Binance Demo userTrades payload is invalid")\n        rows = [row for row in trades.payload if isinstance(row, dict)]\n        try:\n            return (\n                _fill_price_from_user_trades(rows, order_id=order_id),\n                lookup_ms,\n                "userTrades",\n            )\n        except RuntimeError as exc:\n            last_error = str(exc)\n            time.sleep(0.1)\n    raise RuntimeError(\n        "Binance Demo filled order price unavailable after order query and userTrades: "\n        + last_error\n    )\n'''
          if 'def _resolve_fill_price(' not in source:
              if fill_block not in source:
                  raise SystemExit('_fill_price insertion point not found')
              source = source.replace(fill_block, fill_helpers, 1)

          old_open = '        open_fill_price = _fill_price(open_payload)\n'
          new_open = '''        open_fill_price, open_fill_lookup_ms, open_fill_source = _resolve_fill_price(\n            active_client,\n            symbol=symbol,\n            payload=open_payload,\n        )\n'''
          if old_open in source:
              source = source.replace(old_open, new_open, 1)
          elif new_open not in source:
              raise SystemExit('open fill replacement point not found')

          old_close = '        close_fill_price = _fill_price(close_payload)\n'
          new_close = '''        close_fill_price, close_fill_lookup_ms, close_fill_source = _resolve_fill_price(\n            active_client,\n            symbol=symbol,\n            payload=close_payload,\n        )\n'''
          if old_close in source:
              source = source.replace(old_close, new_close, 1)
          elif new_close not in source:
              raise SystemExit('close fill replacement point not found')

          old_latency_open = '                "openOrderAckMs": open_result.latency_ms,\n'
          new_latency_open = old_latency_open + '                "openFillLookupMs": open_fill_lookup_ms,\n'
          if '"openFillLookupMs"' not in source:
              if old_latency_open not in source:
                  raise SystemExit('open latency insertion point not found')
              source = source.replace(old_latency_open, new_latency_open, 1)

          old_latency_close = '                "closeOrderAckMs": close_result.latency_ms,\n'
          new_latency_close = old_latency_close + '                "closeFillLookupMs": close_fill_lookup_ms,\n'
          if '"closeFillLookupMs"' not in source:
              if old_latency_close not in source:
                  raise SystemExit('close latency insertion point not found')
              source = source.replace(old_latency_close, new_latency_close, 1)

          fills_marker = '                "closeAvgPrice": float(close_fill_price),\n'
          fills_extra = fills_marker + '''                "openPriceSource": open_fill_source,\n                "closePriceSource": close_fill_source,\n'''
          if '"openPriceSource"' not in source:
              if fills_marker not in source:
                  raise SystemExit('fills source insertion point not found')
              source = source.replace(fills_marker, fills_extra, 1)

          source_path.write_text(source, encoding='utf-8')

          config_path = Path('config/binance_demo_execution_probe_v1.json')
          config = config_path.read_text(encoding='utf-8').replace(
              'usdm-btcusdt-roundtrip-20260829-v3',
              'usdm-btcusdt-roundtrip-20260829-v4',
          )
          config_path.write_text(config, encoding='utf-8')

          endpoint_test_path = Path('tests/test_binance_demo_position_risk_endpoint.py')
          endpoint_tests = endpoint_test_path.read_text(encoding='utf-8').replace(
              'usdm-btcusdt-roundtrip-20260829-v3',
              'usdm-btcusdt-roundtrip-20260829-v4',
          )
          endpoint_test_path.write_text(endpoint_tests, encoding='utf-8')

          test_path = Path('tests/test_binance_demo_execution.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'class ZeroPriceDemoClient(FakeDemoClient):'
          if marker not in tests:
              tests += '''\n\nclass ZeroPriceDemoClient(FakeDemoClient):\n    def place_market_order(\n        self,\n        *,\n        symbol: str,\n        side: str,\n        quantity: str,\n        hedged: bool,\n        close_long: bool,\n    ) -> RequestResult:\n        self.orders.append(\n            {\n                "symbol": symbol,\n                "side": side,\n                "quantity": quantity,\n                "hedged": hedged,\n                "close_long": close_long,\n            }\n        )\n        if side == "SELL":\n            self.closed = True\n        return RequestResult(\n            payload={\n                "orderId": len(self.orders),\n                "status": "FILLED",\n                "executedQty": quantity,\n                "avgPrice": "0",\n                "price": "0",\n                "cumQuote": "0",\n            },\n            latency_ms=25.0 if side == "BUY" else 30.0,\n        )\n\n    def query_order(self, *, symbol: str, order_id: int) -> RequestResult:\n        order = self.orders[order_id - 1]\n        return RequestResult(\n            payload={\n                "orderId": order_id,\n                "status": "FILLED",\n                "executedQty": order["quantity"],\n                "avgPrice": "0",\n                "price": "0",\n                "cumQuote": "0",\n            },\n            latency_ms=11.0,\n        )\n\n    def account_trades(self, *, symbol: str, order_id: int) -> RequestResult:\n        order = self.orders[order_id - 1]\n        return RequestResult(\n            payload=[\n                {\n                    "orderId": order_id,\n                    "price": self.price,\n                    "qty": order["quantity"],\n                }\n            ],\n            latency_ms=13.0,\n        )\n\n\ndef test_probe_resolves_zero_price_filled_orders_from_user_trades() -> None:\n    client = ZeroPriceDemoClient()\n    result = run_demo_execution_probe(\n        credentials=CredentialEnvelope(api_key="demo", api_secret="secret"),\n        config=_config(),\n        client=client,  # type: ignore[arg-type]\n    )\n\n    assert result["phase"] == "COMPLETE"\n    assert result["passed"] is True\n    assert result["openFilled"] is True\n    assert result["closeFilled"] is True\n    assert result["postPositionZero"] is True\n    assert result["fills"]["openAvgPrice"] == 100000.0\n    assert result["fills"]["closeAvgPrice"] == 100000.0\n    assert result["fills"]["openPriceSource"] == "userTrades"\n    assert result["fills"]["closePriceSource"] == "userTrades"\n    assert result["latency"]["openFillLookupMs"] == 24.0\n    assert result["latency"]["closeFillLookupMs"] == 24.0\n'''
          test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/tmp-patch-demo-usertrades.yml').unlink()
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/eba_trader/binance_demo_execution.py tests/test_binance_demo_execution.py tests/test_binance_demo_position_risk_endpoint.py config/binance_demo_execution_probe_v1.json .github/workflows/tmp-patch-demo-usertrades.yml
          git commit -m 'Demo: resolve fills from account trade history'
          git push origin HEAD:fix-demo-usertrades-fill-proof
