[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eba-trader"
version = "0.1.0"
description = "Research-first autonomous trading system with deterministic risk control"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
eba-binance-data = "eba_trader.binance_probe:run_data_only_probe"
eba-download-history = "eba_trader.history:download_history_cli"
eba-backtest-trend = "eba_trader.backtest:backtest_trend_cli"
eba-baseline-study = "eba_trader.locked_cli:baseline_study_cli"
eba-development-study = "eba_trader.evidence:development_evidence_cli"
eba-development-verdict = "eba_trader.verdict:development_verdict_cli"
eba-risk-execution-study = "eba_trader.risk_evidence:main"
eba-risk-execution-verdict = "eba_trader.risk_verdict:main"
eba-final-freeze = "eba_trader.final_freeze:main"
eba-final-oos = "eba_trader.final_oos:main"
eba-final-oos-verdict = "eba_trader.final_oos_verdict:main"
eba-validate-trend = "eba_trader.validation:trend_validation_cli"
eba-regime-report = "eba_trader.regime_report:regime_report_cli"
eba-trend-v2-development = "eba_trader.trend_v2_evidence:main"

[project.optional-dependencies]
trading = [
  "nautilus_trader==1.230.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/eba_trader"]
